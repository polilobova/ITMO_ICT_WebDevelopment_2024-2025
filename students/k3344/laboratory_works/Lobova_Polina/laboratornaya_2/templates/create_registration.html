<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Регистрация на конференцию</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdad91;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: #ffc7b2;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        form p {
            margin: 10px 0;
        }

        form input {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        form button {
            width: 100%;
            padding: 10px;
            background-color: #c1530c;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        form button:hover {
            background-color: #913700;
        }

        .messages {
            margin-bottom: 20px;
        }

        .messages .alert {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .messages .alert-error {
            background-color: #ffebee;
            color: #c62828;
        }

        .messages .alert-success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            color: #c1530c;
        }
    </style>
</head>
<body>
    <div class="form-container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <h1>Регистрация на конференцию</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Зарегистрироваться</button>
        </form>
        <a href="{% url 'index' %}">Назад к главной странице</a>
    </div>
</body>
</html>
