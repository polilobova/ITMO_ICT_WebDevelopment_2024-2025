<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Главная страница конференции</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdad91;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        h1 {
            color: #333;
        }

        nav {
            margin-bottom: 20px;
        }

        nav a {
            color: #333;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            text-decoration: underline;
            color: #c1530c;
        }

        p {
            color: #333;
        }

        .auth-links a {
            color: #333;
            text-decoration: none;
            margin: 0 10px;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Добро пожаловать на сайт конференций!</h1>
    <nav>
        <a href="{% url 'index' %}">Главная</a> |
        <a href="{% url 'list_conferences' %}">Конференции</a> |
        <a href="{% url 'my_registrations' %}">Мои регистрации</a> |
        <a href="{% url 'create_registration' %}">Добавить регистрацию</a>
    </nav>
    {% if user.is_authenticated %}
        <p>Привет, {{ user.username }}!</p>
        <a href="{% url 'logout' %}">Выйти</a>
    {% else %}
        <a href="{% url 'register' %}">Регистрация</a> |
        <a href="{% url 'login' %}">Вход</a>
    {% endif %}
</body>
</html>
